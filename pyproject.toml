[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "handshake"
version = "0.2.3"
description = "Handshake protocol — Python SDK. Thin PyO3 wrapper over the canonical Rust core (packages/handshake-rs)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Handshake Protocol Authors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]
# Pydantic v2 models live in pure Python alongside the native extension. We
# pin v2 because v1's serialization model differs in ways that would break
# schema-native validation.
dependencies = ["pydantic>=2.7,<3.0"]

[tool.maturin]
# "Mixed" project layout: maturin builds the Rust crate AND ships the pure-
# Python `handshake` package alongside it. The native extension surfaces as
# `handshake._native`; pure-Python re-exports live in handshake/__init__.py.
python-source = "python"
module-name = "handshake._native"
features = ["pyo3/extension-module"]
